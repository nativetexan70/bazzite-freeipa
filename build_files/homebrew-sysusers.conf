# Pinned UID/GID (950/951) for the linuxbrew user and brew group, created via
# systemd-sysusers instead of useradd/groupadd.
#
# /etc/passwd and /etc/group ARE subject to bootc's three-way /etc merge on
# upgrade (unlike /var). useradd/groupadd allocate whatever system ID happens
# to be free on a given build day; across daily rebuilds that can allocate a
# different UID/GID for the same username, and the merge would then apply
# that change to already-deployed machines while the on-disk files under
# /var/home/linuxbrew (seeded once, at first install, with the old numeric
# UID baked into their inodes) don't get renumbered to match -- the account
# silently stops owning its own files. Pinning the UID/GID here makes every
# build produce byte-identical passwd/group entries for this account, so
# there's never a diff for the merge to apply.
u linuxbrew 950 "Homebrew" /home/linuxbrew /bin/bash
g brew 951 -
m linuxbrew brew

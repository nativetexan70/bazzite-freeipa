# sssd's runtime/cache directories live under /var, which is mutable and
# preserved by bootc across upgrades. They are declared here via
# systemd-tmpfiles rather than created directly in build.sh so that no /var
# content is baked into the image layer at build time -- bootc container
# lint's var-tmpfiles check flags directories created directly under /var
# during the build. A real first boot creates these itself from this
# declaration instead.
d /var/lib/sss/db 0711 root root -
d /var/lib/sss/pipes/private 0755 root root -
d /var/log/sssd 0755 root root -
